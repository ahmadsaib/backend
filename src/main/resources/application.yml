server:
  port: ${SERVER_PORT:9090}
spring:
  data:
    mongodb: 
      uri: ${MONGO_DB_URI:mongodb+srv://ahmad:ahmad@cluster0.xqjvr.mongodb.net/test}
      database: ${MONGO_DB_NAME:Caterer}
  kafka:
     consumer:
        bootstrap-servers: ${KAFKA_CONSUMER_SERVER:localhost:9092}
        group-id: group_id
        auto-offset-reset: earliest
        key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
        value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
     producer:
        bootstrap-servers: ${KAFKA_PRODUCER_SERVER:localhost:9092}
        key-serializer: org.apache.kafka.common.serialization.StringSerializer
        value-serializer: org.apache.kafka.common.serialization.StringSerializer

logging:
  level:
    org:
      springframework: INFO
    com:
      Ahmad:
        Caterer: INFO
  pattern:
    console: "%d{yyyy-MMM-dd HH:mm:ss} [%thread] %highlight(%-5level) %cyan(%logger{15}) - %msg %n"
    file: "%d{yyyy-MMM-dd HH:mm:ss} [%thread] %highlight(%-5level) %cyan(%logger{15}) - %msg %n"
  file:
    name: C:/tmp/application.log


      
    